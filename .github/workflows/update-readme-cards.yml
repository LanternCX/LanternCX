name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "17 2 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '17 2 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: monthly-keepalive
      cancel-in-progress: false
    steps:
      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      # Scheduled runs alone do not prevent GitHub's inactivity timeout.
      - name: Keep repository active with an empty commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflow active"
          git push origin "HEAD:$DEFAULT_BRANCH"

  deploy:
    if: github.event.schedule != '17 2 1 * *'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=transparent
          path: _site/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=transparent&layout=compact&langs_count=8&card_width=400&hide=javascript,html,css,php&size_weight=0.5&count_weight=0.5
          path: _site/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
